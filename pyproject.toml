[project]
name = "blues"
version = "0.1.1"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.24.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "hypothesis>=6.151.14",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
